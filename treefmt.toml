[formatter.wezterm]
command = "stylua"
includes = [ "wezterm/*.lua" ]

[formatter.neovim]
command = "stylua"
includes = [ "nvim/*.lua" ]

[formatter.nu]
command = "nufmt"
includes = [ "*.nu" ]

[formatter.python]
command = "black"
includes = [
    "nautilus-extensions/*.py"
]
